# Compile l'exe Windows, le teste, et le publie dans une release. Trois façons de publier :
# - Actions > Windows build > Run workflow, en indiquant la version (ex. v1.6) ;
# - créer une release sur GitHub (Releases > Draft a new release) : l'exe y est ajouté ;
# - pousser un tag vX.Y.
name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier en release (ex. v1.6) ; vide = simple compilation"
        required: false
        default: ""

permissions:
  contents: read

env:
  SDL_AUDIODRIVER: dummy

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: python -m pip install --upgrade pip pygame pillow

      - name: Test (pygame, interface)
        run: python .github/scripts/smoke_test.py

      - name: Test réseau (un tirage par source et catégorie)
        # Les sites peuvent être momentanément indisponibles : informatif, ne bloque pas la compilation
        continue-on-error: true
        run: python .github/scripts/smoke_test.py --network

      - name: PyInstaller avec son bootloader recompilé
        # Le bootloader précompilé de PyInstaller est partagé par des logiciels malveillants, et
        # beaucoup d'antivirus le signalent : le recompiler ici réduit fortement les faux positifs.
        shell: pwsh
        run: |
          python -m pip download --no-binary pyinstaller --no-deps pyinstaller -d pyi
          $archive = Get-ChildItem pyi -Filter *.tar.gz | Select-Object -First 1
          tar -xzf $archive.FullName -C pyi
          $src = Get-ChildItem pyi -Directory | Select-Object -First 1
          Push-Location (Join-Path $src.FullName bootloader)
          python ./waf all --target-arch=64bit
          if ($LASTEXITCODE -ne 0) { throw "échec de la compilation du bootloader" }
          Pop-Location
          python -m pip install $src.FullName
          python -m PyInstaller --version

      - name: Compilation
        shell: pwsh
        run: |
          $common = @("--noconfirm", "--clean", "--windowed", "--noupx",
                      "--name", "UltimateMatrixPlayer", "--icon", "Matrix.ico",
                      "--add-data", "logo.jpg;.", "--version-file", "packaging/version_info.txt")
          python -m PyInstaller @common --distpath dist UMPV16.pyw
          if ($LASTEXITCODE -ne 0) { throw "échec PyInstaller (dossier)" }
          python -m PyInstaller @common --onefile --distpath dist-onefile --workpath build-onefile UMPV16.pyw
          if ($LASTEXITCODE -ne 0) { throw "échec PyInstaller (exe unique)" }

      - name: Les exe démarrent
        shell: pwsh
        run: |
          foreach ($exe in "dist\UltimateMatrixPlayer\UltimateMatrixPlayer.exe", "dist-onefile\UltimateMatrixPlayer.exe") {
            $p = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 15
            if ($p.HasExited) { throw "$exe s'est arrêté (code $($p.ExitCode))" }
            Stop-Process -Id $p.Id -Force
            Write-Host "OK  $exe"
          }

      - name: Les exe trouvent leur logo et lisent un module (--selftest)
        shell: pwsh
        run: |
          python .github/scripts/smoke_test.py --write-mod "$PWD\test.mod"
          foreach ($exe in "dist\UltimateMatrixPlayer\UltimateMatrixPlayer.exe", "dist-onefile\UltimateMatrixPlayer.exe") {
            $p = Start-Process -FilePath $exe -ArgumentList "--selftest", "$PWD\test.mod" -PassThru
            if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "$exe --selftest ne se termine pas" }
            $report = Get-Content (Join-Path (Split-Path $exe) "ump_selftest.txt") -Raw
            Write-Host "== $exe"; Write-Host $report
            foreach ($want in "pillow: OK", "logo: OK", "mixer: OK", "module: OK") {
              if ($report -notmatch [regex]::Escape($want)) { throw "$exe : « $want » manquant" }
            }
          }

      - name: Paquets et empreintes
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          if (-not $ver) { $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" } }
          New-Item -ItemType Directory out | Out-Null
          # Fichiers créés par le test de démarrage : ils n'ont rien à faire dans le paquet
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist\UltimateMatrixPlayer\config.ini, dist\UltimateMatrixPlayer\WebMods, dist\UltimateMatrixPlayer\ump.log, dist\UltimateMatrixPlayer\ump_selftest.txt
          Compress-Archive -Path dist\UltimateMatrixPlayer -DestinationPath "out\UltimateMatrixPlayer-$ver-windows.zip"
          Copy-Item dist-onefile\UltimateMatrixPlayer.exe "out\UltimateMatrixPlayer-$ver-portable.exe"
          Get-ChildItem out | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii out\SHA256SUMS.txt
          Get-Content out\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Une release créée sur GitHub déclenche aussi la création du tag : un seul envoi à la fois
    concurrency: release-${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: out
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Release déjà créée (sur GitHub ou par un autre passage) : on y ajoute ou remplace les fichiers
            gh release upload "$TAG" out/* --clobber
            if [ -z "$(gh release view "$TAG" --json body -q .body)" ]; then
              gh release edit "$TAG" --notes-file packaging/release_notes.md
            fi
          else
            # Crée le tag sur le commit compilé s'il n'existe pas encore
            gh release create "$TAG" out/* --target "$GITHUB_SHA" \
              --title "Ultimate Matrix Player $TAG" \
              --notes-file packaging/release_notes.md
          fi
